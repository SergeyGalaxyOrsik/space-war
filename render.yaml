# Render Blueprint: New → Blueprint → выбрать репозиторий.
services:
  - type: web
    name: pixel-squadron
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: DB_FILE
        value: /data/game.db
    disk:
      name: game-data
      mountPath: /data
      sizeGB: 1
